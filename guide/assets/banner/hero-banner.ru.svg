<title id="t">Реверс-инжиниринг НАЯ</title>
<desc id="d">Сгенерированная иллюстрация, не скриншот. Центральный узел и 11 пронумерованных точек по числу треков: золотая для единственного эксперимента (трек 1), бирюзовые для архивов внешнего материала, фиолетовые для слоёв анализа, синяя для каталога литературы. Заголовок и три числа, посчитанные по репозиторию: 11 треков и 1517 файлов, один сеанс с 3 перципиентами, ослепление нарушено у 2 из 3.</desc>
