<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">SigLIP2: the 0.98 is a crop score, the full photo scores 0.89</title>
<desc id="d">Dot plot of the SigLIP2 bio/organic score from 0 to 1 in five lanes. Artifact, cropped photo from pipeline stage 5: 0.98, a different input. Artifact, full photograph from the control test: 0.89. Similar fossils A1 to A6 range from 0.44 to 0.996, the nearest dark fossil scores 0.9870. Dissimilar biological specimens score up to 0.209; non-biological controls up to 0.0226. A band marks the mean of the five similar fossils, 0.7320, plus or minus one standard deviation, 0.1738; the full photo lies inside it (Z=0.916). The test neither confirms nor excludes anomalous origin.</desc>
