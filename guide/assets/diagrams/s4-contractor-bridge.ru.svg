<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2620 716" width="2620" height="716" role="img" aria-labelledby="t d">
<title id="t">Мост Лазар - подрядчик S-4</title>
<desc id="d">Граф. Три источника показаний из трека 2 (KLAS-TV 1989, Lazar Tape 1991, JRE 2019 и 2025) называют EG&amp;G Special Projects работодателем Лазара. EG&amp;G поглощена URS (2002), URS поглощена AECOM (2014), Amentum выделена из AECOM (2020). К графу привязаны две гипотезы: EG&amp;G как подрядчик S-4 (один источник, Лазар) и Amentum как преемник EG&amp;G (задокументировано). Трек 7 объединяет Amentum и EG&amp;G.</desc>
