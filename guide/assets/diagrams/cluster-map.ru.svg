<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1560" width="1100" height="1560" role="img" aria-labelledby="t d">
<title id="t">Карта институциональных кластеров</title>
<desc id="d">Восемь учреждений слева, одиннадцать пронумерованных случаев справа, люди не названы. Лос-Аламос: случаи 1 (исчез(ла) в июне 2025) и 2 (исчез(ла) в мае 2025). NASA JPL: случай 3 (исчез(ла) в 2025), случаи 4 и 5 (умерли, причина неясна). AFRL: случай 6 (исчез(ла) в феврале 2026). МТИ, Центр науки о плазме и термоядерного синтеза: случай 7 (убит(а), подозреваемый назван, декабрь 2025). Caltech: случай 8 (застрелен(а) дома, февраль 2026). Kansas City National Security Campus: случай 9 (исчез(ла) в 2025). Institute For Exotic Sciences, Алабама: случай 10 (умер(ла), причина неясна, 2022). Novarti, Массачусетс: случай 11 (тело найдено в озере).</desc>
