<title id="t">What is claimed and what the repository shows</title>
<desc id="d">Eight rows, left to right: topic, what is claimed, what the repository shows, a state word. ECP session: 7 of 10 reference parameters match, descriptive only; blinding compromised for 2 of 3; no chance baseline; Reference object: Reference statements of the Program Director; no SEM, XRF or gamma report is committed; AI visual result: 0.98 is a crop score; the full photo scores 0.89, inside the fossil range; neither confirms nor excludes anomalous origin; Lab analysis: Recommended in the control-test report; no laboratory result in the repository; Archives 2, 3, 10: Testimony and interviews recorded as claims; no physical material in public hands; Outreach nodes: Only in the graph JSON; no letter, reply or date in the corpus; Patent: README: no patent filing; the oncology text is a book speculation; Course: Described as in development, pending course-page confirmation; no date, no credential</desc>
