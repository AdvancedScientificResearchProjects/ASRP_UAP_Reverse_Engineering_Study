<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 730" width="1510" height="730" role="img" aria-labelledby="t d">
<title id="t">UAP origin taxonomy</title>
<desc id="d">Tree. The base term UAP, with the AIT framing, splits into three origin categories: interstellar, parallel-reality and temporal. Interstellar maps to the Lazar archive and partially to the Dubna archive (element-115 narrative only). Parallel-reality maps to Chernobrov anomalous-zone field work. Temporal maps to Chernobrov time-machine experiments and to the ECP artifact as a working hypothesis.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1510' height='730' rx='18' fill='url(#bg)'/>

