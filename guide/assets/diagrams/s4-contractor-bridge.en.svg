<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2616 705" width="2616" height="705" role="img" aria-labelledby="t d">
<title id="t">Lazar S-4 contractor bridge</title>
<desc id="d">Graph. Three testimony sources of Track 2 (KLAS-TV 1989, Lazar Tape 1991, JRE 2019 and 2025) name EG&amp;G Special Projects as Lazar's employer. EG&amp;G was acquired by URS (2002), URS by AECOM (2014), and Amentum was spun off from AECOM (2020). Two hypotheses are linked to the graph: EG&amp;G as S-4 contractor (single source, Lazar) and Amentum as EG&amp;G successor (documented). Track 7 groups Amentum and EG&amp;G.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='2616' height='705' rx='18' fill='url(#bg)'/>

