<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Контур, родственные работы, утверждения графа</title>
<desc id="d">Три блока. Сверху: заявленный в README контур коммерциализации из пяти связанных блоков: исследование, репозиторий, курс по НАЯ в разработке, инженерная образовательная лицензия, доход от меценатов и инвестиций; репозиторий не утверждает, что курс запущен (указано: в разработке, ожидает подтверждения страницы курса). Внизу слева: родственные работы и патенты как ссылки экосистемы, заявки по этому исследованию нет. Внизу справа, пунктиром: утверждения, существующие только в JSON графа (первый читатель DoE и Лос-Аламос, admin-передача Stanford, подача NCI SBIR, переговоры Cortical Labs, Boeing около 40 млн долларов в год, помечено иллюстративным) без письма, ответа или даты в корпусе.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='640' rx='18' fill='url(#bg)'/>

