<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2043" width="1100" height="2043" role="img" aria-labelledby="t d">
<title id="t">Контур топливоснабжения</title>
<desc id="d">Граф вокруг одной гипотезы. Лазар называет работодателем EG&amp;G, а топливом реактора S-4 элемент 115. Элемент 115 (московий) синтезирован в 2003 и 2004 в ОИЯИ (Дубна) с мишенью америций-243 от LLNL, что задокументировано в Phys. Rev. C 69 (2004). LLNS LLC управляет LLNL, Amentum входит в консорциум. EG&amp;G (1947) стала URS (2002), AECOM (2014) и Amentum, что замыкает контур к EG&amp;G. Оценки уверенности принадлежат исходной схеме.</desc>
