<title id="t">2026 in the study, and dates the archives record</title>
<desc id="d">Two lanes. Upper lane to scale, 2026-04-01 to 2026-07-18: 2026-04-01 First commit of the repository; 2026-04-04 ECP session ECP-2026-04-04, three percipients; 2026-04-06 Validation report: reference compared with responses; 2026-04-07 AI report: segmentation, SigLIP2, anomaly, depth; 2026-04-09 AI control test: full photo, 13 controls; 2026-04-19 FBI consolidation claim (recap; unverified); 2026-05-08 PURSUE Release 01: 161 records; 2026-05-22 PURSUE Release 02: 64 records; 2026-07-18 Last commit before the showcase. Lower lane not to scale, dates the archives record: 1989 Lazar appearances begin (corpus 1989-2026); 2004 JINR+LLNL element 115 synthesis published (Phys. Rev. C); 2021-09-28 Dubna interview recorded; 2025-12-09 Dubna interview published.</desc>
