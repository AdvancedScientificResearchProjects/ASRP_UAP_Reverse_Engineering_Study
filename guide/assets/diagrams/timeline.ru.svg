<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">2026 год в исследовании и даты из архивов</title>
<desc id="d">Две полосы. Верхняя в масштабе, 2026-04-01 .. 2026-07-18: 2026-04-01 Первый коммит репозитория; 2026-04-04 Сеанс КП ECP-2026-04-04, три перципиента; 2026-04-06 Отчёт валидации: референс против ответов; 2026-04-07 ИИ-отчёт: сегментация, SigLIP2, аномалии, глубина; 2026-04-09 Контрольный тест ИИ: полное фото, 13 контролей; 2026-04-19 Заявление ФБР о консолидации (пересказ; не проверено); 2026-05-08 PURSUE Релиз 01: 161 запись; 2026-05-22 PURSUE Релиз 02: 64 записи; 2026-07-18 Последний коммит до витрины. Нижняя не в масштабе, даты, записанные архивами: 1989 Начало выступлений Лазара (корпус 1989-2026); 2004 Опубликован синтез 115 элемента ОИЯИ+LLNL (Phys. Rev. C); 2021-09-28 Интервью по Дубне записано; 2025-12-09 Интервью по Дубне опубликовано.</desc>
