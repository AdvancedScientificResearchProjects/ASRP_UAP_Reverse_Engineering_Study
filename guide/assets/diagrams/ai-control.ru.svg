<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
<title id="t">SigLIP2: 0.98 это оценка обрезки, полное фото даёт 0.89</title>
<desc id="d">Точечный график био/органического балла SigLIP2 от 0 до 1 в пяти полосах. Артефакт, обрезанное фото со стадии 5 конвейера: 0.98, другой вход. Артефакт, полная фотография из контрольного теста: 0.89. Похожие окаменелости A1-A6 лежат от 0.44 до 0.996, ближайшая тёмная даёт 0.9870. Непохожие биологические образцы до 0.209; небиологические контроли до 0.0226. Полоса отмечает среднее пяти похожих окаменелостей 0.7320 плюс-минус одно стандартное отклонение 0.1738; полное фото лежит внутри (Z=0.916). Тест не подтверждает и не исключает аномальное происхождение.</desc>
