<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2042" width="1100" height="2042" role="img" aria-labelledby="t d">
<title id="t">Fuel-supply-chain loop: Dubna, Lazar, Amentum, LLNL</title>
<desc id="d">Graph around one hypothesis. Lazar names EG&amp;G as employer and element 115 as the S-4 reactor fuel. Element 115 (moscovium) was synthesised in 2003 and 2004 by JINR Dubna with an americium-243 target from LLNL, documented in Phys. Rev. C 69 (2004). LLNS LLC operates LLNL and Amentum is a consortium member. EG&amp;G (1947) became URS (2002), AECOM (2014) and Amentum, which closes the loop back to EG&amp;G. Confidence grades are the original figure's.</desc>
