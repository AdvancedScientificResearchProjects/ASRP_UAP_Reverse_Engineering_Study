<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 854" width="1200" height="854" role="img" aria-labelledby="t d">
<title id="t">Ответы против раскрытого референса</title>
<desc id="d">Десять параметров референса в строках, три колонки перципиентов P1-P3 (точно, частично, ошибочно, нет данных) и итог. Маяк: 2 точно, 1 частично. Система: 3 точно. Нет сознания: 3 точно. Местность: 1 точно. Внеземное: 3 точно. Стационарность: 1 ошибочно. Навигация во времени: 1 косвенно. Биометалл: 3 частично. Переменная радиоактивность: не обнаружено. Курьер: 2 точно. Итого: 7 из 10 с точным совпадением, 2 частично, 1 промах. Только описательно, потому что ослепление нарушено.</desc>
