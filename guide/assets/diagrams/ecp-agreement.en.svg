<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t d">
<title id="t">Response agreement across three percipients</title>
<desc id="d">Eight rows (themes), three columns (P1, P2, P3) with the words present, partial, absent or contradictory, and an overlap level. Signal function: present, partial, present, medium. Part of a larger system: present three times, high. No autonomous consciousness: present three times, high. Non-terrestrial origin: partial, partial, present, medium. Non-standard mineral material: partial three times, medium. Channel upward: present three times, high. No danger: present three times, high. Dynamic movement: contradictory, partial, absent, low. Percipient names are withheld. Blinding was compromised for P2 and P3.</desc>
