<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1007" width="1100" height="1007" role="img" aria-labelledby="t d">
<title id="t">Обзор исследования</title>
<desc id="d">Схема потока. Изображение артефакта UAP-FRAG-001 даёт три ветви: ИИ-анализ визуальных и материальных характеристик ведёт к гипотезам о материале и структуре; архивный и сравнительный анализ ведёт к гипотезам о контексте и происхождении; КП-сеансы перципиентов ведут к трём отчётам, сравнению ответов и валидации по референсу. Все три ветви сходятся в межконвейерном синтезе.</desc>
