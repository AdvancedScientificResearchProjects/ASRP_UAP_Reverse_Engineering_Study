<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Who heard what before answering</title>
<desc id="d">Sequence diagram of one group call with a moderator and three percipients P1, P2, P3, names withheld. The moderator prompts P1 first and receives a raw response; prompts P2 after P1's answer, so P2 heard P1; prompts P3 after both, so P3 heard both. P1 is partly blind (saw the object earlier without explanation); P2 and P3 are compromised. Future sessions must be individual.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='600' rx='18' fill='url(#bg)'/>

