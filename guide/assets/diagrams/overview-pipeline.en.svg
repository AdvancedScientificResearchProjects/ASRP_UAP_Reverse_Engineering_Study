<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 985" width="1100" height="985" role="img" aria-labelledby="t d">
<title id="t">Research overview</title>
<desc id="d">Flow diagram. UAP-FRAG-001 artifact imagery feeds three branches: AI visual and material analysis leading to material and structure hypotheses; archival and comparative analysis leading to context and provenance hypotheses; and ECP percipient sessions leading to three recorded percipient reports, cross-response comparison and reference validation. All three branches meet in the cross-pipeline synthesis.</desc>
