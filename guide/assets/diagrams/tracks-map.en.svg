<title id="t">Eleven tracks in four kinds</title>
<desc id="d">Eleven track cards in four kinds. Experiment (gold): Track 1, the artifact UAP-FRAG-001 with one percipient session of 3 percipients, 3 AI reports and a 10-stage vision pipeline. Archives of external material (teal): Track 2 Lazar (26 transcripts), Track 3 Chernobrov (22), Track 4 Dubna, Track 10 Gershtein (62), Track 11 PURSUE (225 records, 284 transcripts). Analysis layers (violet): Track 5 OSINT method, Track 6 people, Track 7 corporate, Track 8 synthesis. Catalog (blue): Track 9 literature. Every card ends with a state word.</desc>
