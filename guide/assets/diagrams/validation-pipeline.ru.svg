<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2158 1966" width="2158" height="1966" role="img" aria-labelledby="t d">
<title id="t">Конвейер валидации OSINT</title>
<desc id="d">Схема метода сверху вниз. Семь шагов в цепочке: изоляция параметров, поиск порога, временная структура, мультиканальная проверка, масштабирование, моделирование, краш-тест гипотезы. Они ведут к проверке по пяти критериям приёмки: воспроизводится, имеет порог, имеет сигнатуру, масштабируется, не укладывается в существующую модель. Если выполнены все пять, итог: новый физический режим. Проверка также отсеивает три типа ошибок: одиночный странный сигнал, неучтённые шум и артефакты, смешение процессов.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='2158' height='1966' rx='18' fill='url(#bg)'/>

