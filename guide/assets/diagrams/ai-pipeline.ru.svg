<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1642 585" width="1642" height="585" role="img" aria-labelledby="t d">
<title id="t">Сводка конвейера ИИ</title>
<desc id="d">Схема слева направо. Входное фото сегментируется (IoU 0.977). Сегмент идёт в три метода: SigLIP2 (коралл или окаменелый морской ёж, 0.98 sigmoid), EfficientAD (аномалий поверхности нет) и Depth Anything (карта относительной глубины). SigLIP2 ведёт к шагу LLM Visual (совпадение Cidaridae), он ведёт к блоку межметодной конвергенции, AI + ECP: coral-like.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1642' height='585' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Сводка конвейера ИИ</text>
