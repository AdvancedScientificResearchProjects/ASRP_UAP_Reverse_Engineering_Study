<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 770" width="1510" height="770" role="img" aria-labelledby="t d">
<title id="t">Таксономия происхождения ОАП</title>
<desc id="d">Дерево. Базовый термин ОАП с рамкой AIT делится на три категории происхождения: межзвёздные, параллельная реальность и темпоральные. Межзвёздные относятся к архиву Лазара и частично к архиву Дубны (только нарратив об элементе 115). Параллельная реальность относится к полевой работе Черноброва в аномальных зонах. Темпоральные относятся к экспериментам Черноброва с машиной времени и к ECP-артефакту как рабочей гипотезе.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1510' height='770' rx='18' fill='url(#bg)'/>

