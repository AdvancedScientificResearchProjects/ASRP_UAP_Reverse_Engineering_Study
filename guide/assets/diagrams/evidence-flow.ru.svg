<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1642 338" width="1642" height="338" role="img" aria-labelledby="t d">
<title id="t">Схема синтеза доказательств</title>
<desc id="d">Схема слева направо. Необработанные утверждения перципиентов превращаются в нормализованные темы, затем в согласованность ответов, затем в валидацию по референсу, затем в гипотезы на уровне репозитория. Второй путь идёт от необработанных утверждений через первичные отчёты к согласованности ответов.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1642' height='338' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Схема синтеза доказательств</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>От необработанных утверждений к гипотезам репозитория</text>
