<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Stated loop, siblings, and claims only in the graph</title>
<desc id="d">Three blocks. Top: the stated commercialization loop in the README as five connected boxes: research, repository, UAP course in development, engineering-education license, patron and investment income; the course is not live. Bottom left: sibling studies and patents listed as ecosystem references, with no patent filing for this study. Bottom right, dashed: claims that exist only in the graph JSON (DoE and Los Alamos first reader, Stanford admin handoff, NCI SBIR submission, Cortical Labs negotiations, Boeing about 40 million dollars a year, labelled illustrative) with no letter, reply or date in the corpus.</desc>
