<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2158 1944" width="2158" height="1944" role="img" aria-labelledby="t d">
<title id="t">OSINT validation pipeline</title>
<desc id="d">Method scheme, top to bottom. Seven steps in a chain: parameter isolation, threshold search, temporal structure, multi-channel verification, scaling, modelling, hypothesis crash-test. They lead to a gate of five acceptance criteria: reproducible, has threshold, has signature, scales, does not fit the existing model. If all five hold the outcome is a new physical regime. The gate also rejects three failure modes: a single strange signal, ignored noise and artifacts, mixed processes.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='2158' height='1944' rx='18' fill='url(#bg)'/>

