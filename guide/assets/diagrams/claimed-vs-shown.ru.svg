<title id="t">Что заявлено и что показывает репозиторий</title>
<desc id="d">Восемь строк слева направо: тема, что заявлено, что показывает репозиторий, слово-состояние. Сеанс КП: 7 из 10 параметров референса совпали, только описательно; ослепление нарушено у 2 из 3; шансового базиса нет; Референс: Утверждения руководителя программы; отчётов SEM, XRF или гамма в репозитории нет; Итог ИИ: 0.98 это оценка обрезанного фото; полное фото даёт 0.89, внутри диапазона окаменелостей; аномальное происхождение не подтверждено и не исключено; Лаборатория: Рекомендован в отчёте контрольного теста; лабораторного результата в репозитории нет; Архивы 2, 3, 10: Свидетельства и интервью записаны как заявления; физического материала в открытом доступе нет; Узлы аутрича: Только в JSON графа; ни письма, ни ответа, ни даты в корпусе нет; Патент: README: заявки нет; онкологический текст это спекуляция из книги; Курс: Описан как разрабатываемый; не запущен, без даты и сертификата</desc>
