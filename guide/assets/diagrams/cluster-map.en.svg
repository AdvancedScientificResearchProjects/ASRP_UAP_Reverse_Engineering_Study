<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1525" width="1100" height="1525" role="img" aria-labelledby="t d">
<title id="t">Institutional cluster map</title>
<desc id="d">Eight institutions on the left, eleven numbered cases on the right, persons not named. Los Alamos: cases 1 (disappeared June 2025) and 2 (disappeared May 2025). NASA JPL: case 3 (disappeared 2025), cases 4 and 5 (died, unclear). AFRL: case 6 (disappeared February 2026). MIT Plasma Science and Fusion Center: case 7 (killed, suspect, December 2025). Caltech: case 8 (shot at home, February 2026). Kansas City National Security Campus: case 9 (disappeared 2025). Institute For Exotic Sciences, Alabama: case 10 (died, unclear, 2022). Novarti, Massachusetts: case 11 (found dead in a lake).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1100' height='1525' rx='18' fill='url(#bg)'/>

