<title id="t">Responses against the disclosed reference</title>
<desc id="d">Ten reference parameters in rows, three percipient columns P1 to P3 (exact, partial, incorrect, no data) and a summary. Beacon: 2 exact, 1 partial. System: 3 exact. No consciousness: 3 exact. Terrain: 1 exact. Non-terrestrial: 3 exact. Stationary: 1 incorrect. Temporal navigation: 1 indirect. Biometal: 3 partial. Variable radioactivity: not detected. Courier: 2 exact. Totals: 7 of 10 with an exact match, 2 partial, 1 miss. Descriptive only because blinding was compromised.</desc>
