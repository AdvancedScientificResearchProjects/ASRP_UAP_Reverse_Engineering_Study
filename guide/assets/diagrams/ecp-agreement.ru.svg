<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t d">
<title id="t">Согласованность ответов трёх перципиентов</title>
<desc id="d">Восемь строк (темы), три колонки (P1, P2, P3) со словами ясно, частично, нет сигнала или противоречие и уровень пересечения. Сигнальная функция: ясно, частично, ясно, средняя. Часть большей системы: ясно трижды, высокая. Нет автономного сознания: ясно трижды, высокая. Внеземное происхождение: частично, частично, ясно, средняя. Нестандартный минеральный материал: частично трижды, средняя. Канал вверх: ясно трижды, высокая. Нет опасности: ясно трижды, высокая. Динамика: противоречие, частично, нет сигнала, низкая. Имена перципиентов не приводятся. Ослепление нарушено у P2 и P3.</desc>
