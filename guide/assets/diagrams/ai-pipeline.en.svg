<title id="t">AI pipeline summary</title>
<desc id="d">Flow diagram, left to right. The input photo is segmented (IoU 0.977). The segment goes to three methods: SigLIP2 (coral or sea urchin fossil, 0.98 sigmoid), EfficientAD (no surface anomalies) and Depth Anything (relative depth map). SigLIP2 feeds the LLM visual step (Cidaridae match), which leads to the box cross-method convergence, AI plus ECP: coral-like.</desc>
