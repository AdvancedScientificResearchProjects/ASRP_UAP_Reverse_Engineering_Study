<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-labelledby="t d">
<title id="t">Одиннадцать треков четырёх видов</title>
<desc id="d">Одиннадцать карточек треков четырёх видов. Эксперимент (золото): трек 1, артефакт UAP-FRAG-001, один сеанс с 3 перципиентами, 3 ИИ-отчёта и конвейер из 10 стадий зрения. Архивы внешнего материала (бирюза): трек 2 Лазар (26 транскриптов), трек 3 Чернобров (22), трек 4 Дубна, трек 10 Герштейн (62), трек 11 PURSUE (225 записей, 284 транскриптов). Слои анализа (фиолет): трек 5 метод OSINT, трек 6 люди, трек 7 корпорации, трек 8 синтез. Каталог (синий): трек 9 литература. Каждая карточка кончается словом-состоянием.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='664' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Одиннадцать треков четырёх видов</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Эксперимент только трек 1; остальные фиксируют или анализируют</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ТРЕКИ</text>
<rect x='24' y='100' width='270' height='142' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='38' y='131.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>1 · Артефакт + сеанс КП</text>
<text x='38' y='151.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Один объект, один сеанс с 3</text>
<text x='38' y='171.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>перципиентами, 3 ИИ-отчёта, 10</text>
<text x='38' y='191.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>стадий CV</text>
<text x='38' y='212.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◧ ПРЕДВАРИТЕЛЬНО</text>
